# הבניין שלי — אתר סטטי, בלי שלב בנייה
[build]
  publish = "."
  command = ""

# index ו-sw חייבים להיבדק מול השרת בכל טעינה,
# אחרת מנגנון העדכון לא יזהה גרסה חדשה
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
