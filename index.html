<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F5F1E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הבניין שלי">
<link rel="manifest" href="manifest.json">
<title>הבניין שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@300;400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== ערכות נושא ===================== */
html[data-theme=light]{
  --bg:#F5F1E9;
  --wash1:rgba(176,138,60,.20); --wash2:rgba(90,125,145,.16);
  --glass:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.52));
  --glass-2:rgba(255,255,255,.55);
  --top:linear-gradient(180deg,rgba(250,247,241,.92),rgba(250,247,241,.72));
  --sheet:#FBF8F2;
  --line:rgba(30,42,53,.14); --line-s:rgba(30,42,53,.08);
  --text:#1E2A35; --dim:#6E7B87;
  --gold:#B08A3C; --gold-2:#D8B366; --gold-tx:#8A6A24; --gold-soft:rgba(176,138,60,.13); --gold-ink:#2A1E08;
  --rest:#5A7D91; --rest-tx:#456A7D; --rest-soft:rgba(90,125,145,.13);
  --slot:rgba(255,255,255,.6); --slot-b:rgba(30,42,53,.1);
  --cov:rgba(30,42,53,.09); --cov-b:rgba(30,42,53,.16); --cov-tx:#5C6874;
  --shadow:0 18px 38px -22px rgba(30,42,53,.42), inset 0 1px 0 rgba(255,255,255,.9);
  --glow:0 0 0 rgba(0,0,0,0);
}
html[data-theme=dark]{
  --bg:#0A0F14;
  --wash1:rgba(224,169,63,.20); --wash2:rgba(63,115,135,.16);
  --glass:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  --glass-2:rgba(255,255,255,.04);
  --top:linear-gradient(180deg,rgba(10,15,20,.94),rgba(10,15,20,.72));
  --sheet:#111A22;
  --line:rgba(226,214,190,.12); --line-s:rgba(226,214,190,.07);
  --text:#ECE8E1; --dim:#8D9AA5;
  --gold:#E0A93F; --gold-2:#F7DFA6; --gold-tx:#F7DFA6; --gold-soft:rgba(224,169,63,.11); --gold-ink:#20160a;
  --rest:#3F7387; --rest-tx:#8CC6D8; --rest-soft:rgba(63,115,135,.13);
  --slot:rgba(255,255,255,.035); --slot-b:rgba(226,214,190,.07);
  --cov:rgba(255,255,255,.09); --cov-b:rgba(226,214,190,.18); --cov-tx:#B6BFC7;
  --shadow:0 20px 44px -16px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05);
  --glow:0 0 18px -4px rgba(224,169,63,.5);
}
:root{ --bar-h:66px; --img-top:url(''); --img-shaft:url(''); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* כללי מחלקה עם display דורסים את [hidden] של הדפדפן — זה מחזיר את הסדר */
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .4s ease,color .4s ease}
body::before{content:"";position:fixed;inset:-15%;z-index:-2;pointer-events:none;
  background:radial-gradient(32rem 26rem at 84% -2%,var(--wash1),transparent 62%),
             radial-gradient(30rem 26rem at 2% 52%,var(--wash2),transparent 64%),
             radial-gradient(26rem 22rem at 60% 104%,var(--wash1),transparent 60%);
  transform:translateY(var(--par,0))}

h1,h2,h3{font-family:'Secular One',system-ui,sans-serif;font-weight:400;line-height:1.28;margin:0}
html[dir=ltr] h1,html[dir=ltr] h2,html[dir=ltr] h3{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;letter-spacing:-.022em}
h1{font-size:1.6rem} h2{font-size:1.26rem} h3{font-size:1rem}
.num{font-family:'Space Grotesk','Heebo',monospace;font-variant-numeric:tabular-nums}
.eyebrow{display:block;font-size:.67rem;letter-spacing:.22em;color:var(--gold-tx);margin-bottom:.4rem;font-weight:500}
.muted{color:var(--dim);font-size:.88rem}
p{margin:.4rem 0}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:18px 0}

/* ---------- סרגל עליון ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--top);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--line-s);overflow:hidden}
.topbar::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.14;
  background-image:var(--img-top);background-size:cover;background-position:center}
.mark{width:30px;height:30px;border-radius:9px;flex:none;position:relative;
  background:var(--gold-soft);border:1px solid var(--line)}
.mark::before,.mark::after{content:"";position:absolute;top:7px;bottom:7px;width:2px;border-radius:2px;
  background:linear-gradient(var(--gold),transparent)}
.mark::before{right:9px}.mark::after{left:9px}
.bldg{font-family:'Secular One',sans-serif;font-size:1rem;line-height:1.1;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html[dir=ltr] .bldg{font-family:'Space Grotesk',sans-serif;font-weight:600}
.times{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:11px;
  background:var(--gold-soft);border:1px solid var(--line);flex:none}
.times b{font-family:'Space Grotesk',monospace;font-size:.82rem;font-weight:500;color:var(--gold-tx)}
.times i{width:1px;height:12px;background:var(--line);display:block}
.times b:last-child{color:var(--rest-tx)}
.acct{height:34px;min-width:34px;padding:0 9px;border-radius:11px;flex:none;display:flex;align-items:center;
  gap:6px;background:var(--glass-2);border:1px solid var(--line);color:var(--dim);
  font-family:'Heebo',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer}
.acct:hover{color:var(--text)}
.acct.reg{background:var(--gold-soft);color:var(--gold-tx)}
.acct svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.week{display:flex;align-items:center;justify-content:center;gap:14px;padding:9px 16px;
  border-bottom:1px solid var(--line-s)}
.week button{background:none;border:0;color:var(--dim);font-size:1.05rem;cursor:pointer;padding:2px 8px;border-radius:8px}
.week button:hover{color:var(--gold-tx);background:var(--glass-2)}
.week span{font-size:.82rem;color:var(--dim)}
.week span b{color:var(--text);font-weight:500}
.week .cd{color:var(--gold-tx)}

main{max-width:680px;margin:0 auto;padding:18px 16px calc(var(--bar-h) + env(safe-area-inset-bottom) + 26px)}
.panel{display:none}
.panel.on{display:block;animation:pin .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes pin{from{opacity:0;transform:translateY(12px)}}
.panel>*{animation:stag .5s cubic-bezier(.2,.8,.3,1) both}
.panel>*:nth-child(1){animation-delay:.02s}.panel>*:nth-child(2){animation-delay:.07s}
.panel>*:nth-child(3){animation-delay:.12s}.panel>*:nth-child(4){animation-delay:.17s}
.panel>*:nth-child(5){animation-delay:.22s}
@keyframes stag{from{opacity:0;transform:translateY(14px)}}
.head{margin-bottom:15px}
.head p{color:var(--dim);font-size:.9rem;margin-top:4px}

.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px;
  box-shadow:var(--shadow);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
.card+.card{margin-top:12px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:400px){.grid2{grid-template-columns:1fr}}
label.fld{display:block;font-size:.75rem;color:var(--dim);margin-bottom:6px}
input,select{width:100%;background:var(--glass-2);color:var(--text);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;font-family:'Heebo',sans-serif;font-size:1rem}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
button{font-family:'Heebo',sans-serif;cursor:pointer;border:0;
  transition:transform .15s,box-shadow .2s,background .2s,color .2s,border-color .2s}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);font-weight:700;
  font-size:.98rem;padding:13px 22px;border-radius:13px;box-shadow:0 10px 22px -12px var(--gold)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn.ghost:hover{background:var(--glass-2)}
.btn.sm{padding:9px 15px;font-size:.85rem;border-radius:11px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--glass-2);border:1px solid var(--line);color:var(--dim);
  border-radius:999px;padding:8px 14px;font-size:.84rem;font-weight:500}
.chip:hover{color:var(--text)}
.chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-tx)}

.per{margin-top:15px}
.per h4{margin:0 0 8px;font-size:.67rem;letter-spacing:.17em;color:var(--dim);font-weight:500;
  display:flex;align-items:center;gap:9px}
.per h4::after{content:"";flex:1;height:1px;background:var(--line-s)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px}
.slot{font-family:'Space Grotesk',monospace;font-size:.79rem;padding:10px 2px;border-radius:10px;
  background:var(--slot);border:1px solid var(--slot-b);color:var(--dim);
  user-select:none;-webkit-user-select:none;touch-action:pan-y}
.slot.cov{background:var(--cov);border-color:var(--cov-b);color:var(--cov-tx)}
.slot.fix{background:var(--rest-soft);border-color:var(--rest);color:var(--rest-tx);cursor:not-allowed}
.slot.on{background:linear-gradient(180deg,var(--gold-2),var(--gold));border-color:var(--gold);
  color:var(--gold-ink);font-weight:600;box-shadow:0 6px 16px -8px var(--gold)}
.slot:active{transform:scale(.93)}
.keys{display:flex;flex-wrap:wrap;gap:13px;margin-top:13px;font-size:.74rem;color:var(--dim)}
.keys i{display:inline-block;width:13px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.keys .k1{background:linear-gradient(180deg,var(--gold-2),var(--gold))}
.keys .k2{background:var(--cov);border:1px solid var(--cov-b)}
.keys .k3{background:var(--rest-soft);border:1px solid var(--rest)}

.shaftbox{position:relative;padding:18px 14px;border-radius:18px;border:1px solid var(--line);
  background:var(--glass);box-shadow:var(--shadow);overflow:hidden}
.shaftbox::before{content:"";position:absolute;inset:0;opacity:.12;
  background-image:var(--img-shaft);background-size:cover;background-position:center}
.shaft{position:relative;display:flex;flex-direction:column;gap:3px}
.hr{display:grid;grid-template-columns:48px 1fr 1fr;gap:5px;align-items:center;opacity:0;transform:translateY(7px)}
.hr.in{animation:lift .4s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:calc(var(--i) * 18ms)}
@keyframes lift{to{opacity:1;transform:none}}
.hr .t{font-family:'Space Grotesk',monospace;font-size:.71rem;color:var(--dim);text-align:end}
.cell{height:19px;border-radius:5px;background:var(--rest-soft);border:1px solid var(--line-s)}
.cell.lit{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) calc(45% + var(--d,0)*45%),transparent),
  color-mix(in srgb,var(--gold-2) calc(50% + var(--d,0)*50%),transparent));
  border-color:var(--gold);box-shadow:var(--glow)}
.cell.fix{outline:1px dashed var(--rest);outline-offset:-3px}
.legend{display:flex;gap:15px;justify-content:center;margin-top:13px;font-size:.74rem;color:var(--dim);position:relative;flex-wrap:wrap}
.legend i{display:inline-block;width:13px;height:8px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.legend .a{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.legend .b{background:var(--rest-soft);border:1px solid var(--line)}
.legend .c{background:transparent;border:1px dashed var(--rest)}
.win{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;
  background:var(--gold-soft);border:1px solid var(--line);margin-top:8px}
.win .num{font-size:1.02rem;color:var(--gold-tx);font-weight:600}
.win small{color:var(--dim)}

.cube{position:relative;border-radius:20px;padding:26px 20px;overflow:hidden;text-align:center;
  border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow)}
.cube::before{content:"";position:absolute;inset:0;z-index:0;
  background:radial-gradient(120% 100% at 50% 0%,var(--gold-soft),transparent 66%)}
.cube>*{position:relative}
.cube .lbl{font-size:.78rem;color:var(--dim);letter-spacing:.06em}
.cube .big{font-family:'Space Grotesk',monospace;font-size:3rem;font-weight:600;line-height:1.05;
  color:var(--gold-tx);margin:6px 0 2px;display:block}
.cube .sub{font-size:.9rem}
.cube .sub b{color:var(--gold-tx);font-family:'Space Grotesk',monospace;font-weight:600}
.bar{margin-top:11px}
.bar .cap{display:flex;justify-content:space-between;font-size:.8rem;color:var(--dim);margin-bottom:5px}
.bar .cap b{font-family:'Space Grotesk',monospace;color:var(--text);font-weight:600}
.bar .track{height:11px;border-radius:6px;background:var(--glass-2);overflow:hidden;border:1px solid var(--line-s)}
.bar .fill{height:100%;width:0;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.3,1)}
.bar.full .fill{background:linear-gradient(90deg,var(--rest),var(--rest-tx))}
.bar.plan .fill{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.calc{width:100%;border-collapse:collapse;margin-top:6px}
.calc td{padding:9px 2px;border-bottom:1px solid var(--line-s);font-size:.88rem;text-align:start}
.calc td:last-child{text-align:end;font-family:'Space Grotesk',monospace;color:var(--text)}
.calc td:first-child{color:var(--dim)}
.calc tr:last-child td{border-bottom:0;font-weight:700;color:var(--gold-tx)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{padding:15px 14px;border-radius:15px;border:1px solid var(--line);background:var(--glass-2)}
.stat b{display:block;font-family:'Space Grotesk',monospace;font-size:1.5rem;font-weight:600;color:var(--rest-tx);line-height:1.15}
.stat.gold b{color:var(--gold-tx)}
.stat span{font-size:.74rem;color:var(--dim);display:block;margin-top:4px}

.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.unit{padding:11px 5px;border-radius:13px;text-align:center;border:1px solid var(--line);background:var(--glass-2)}
.unit b{display:block;font-family:'Space Grotesk',monospace;font-size:1rem;font-weight:600}
.unit small{font-size:.65rem;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit small.who2{color:var(--text);font-size:.67rem}
.unit small.who2.an{color:var(--rest-tx);font-style:italic}
.unit.done{border-color:var(--gold);background:var(--gold-soft)}
.unit.done b{color:var(--gold-tx)}
.pbar{height:6px;border-radius:4px;background:var(--glass-2);overflow:hidden;margin:10px 0 4px;border:1px solid var(--line-s)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .8s cubic-bezier(.2,.8,.3,1)}
.rem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:12px;
  background:var(--glass-2);border:1px solid var(--line-s);margin-top:7px}
.rem .nm{font-size:.9rem}
.rem .nm small{display:block;color:var(--dim);font-size:.74rem;font-family:'Space Grotesk',monospace;direction:ltr}
.wa{background:rgba(37,211,102,.14);border:1px solid rgba(37,211,102,.45);color:#1a8f4c;border-radius:10px;
  padding:7px 12px;font-size:.8rem;font-weight:600;text-decoration:none;flex:none}
html[data-theme=dark] .wa{color:#7ee2a8}
.note{font-size:.81rem;color:var(--dim);border-inline-start:2px solid var(--gold);
  padding-inline-start:11px;margin-top:14px}

.lock{text-align:center;padding:30px 20px}
.lock .ic{width:52px;height:52px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;
  background:var(--gold-soft);border:1px solid var(--line);color:var(--gold-tx)}
.lock .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
.lock h3{margin-bottom:6px}
.lock p{color:var(--dim);font-size:.9rem;max-width:34ch;margin:0 auto 16px}
.who{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:11px;
  background:var(--gold-soft);border:1px solid var(--line);font-size:.85rem}
.who b{color:var(--gold-tx);font-family:'Space Grotesk',monospace;font-weight:600}
.who .an{color:var(--rest-tx);font-size:.75rem}

.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;
  border-bottom:1px solid var(--line-s);cursor:pointer}
.sw:last-of-type{border-bottom:0}
.sw .lb{font-size:.94rem}
.sw .lb small{display:block;color:var(--dim);font-size:.76rem;margin-top:2px;line-height:1.45}
.sw .tg{width:46px;height:27px;border-radius:99px;background:var(--cov);border:1px solid var(--line);
  flex:none;position:relative;transition:background .25s,border-color .25s}
.sw .tg::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:21px;height:21px;border-radius:50%;
  background:var(--dim);transition:transform .25s cubic-bezier(.2,.8,.3,1),background .25s}
.sw.on .tg{background:var(--gold-soft);border-color:var(--gold)}
.sw.on .tg::after{background:var(--gold)}
html[dir=rtl] .sw.on .tg::after{transform:translateX(-19px)}
html[dir=ltr] .sw.on .tg::after{transform:translateX(19px)}
.segs{display:flex;gap:6px;background:var(--glass-2);border:1px solid var(--line-s);
  border-radius:13px;padding:4px;margin-top:10px}
.seg{flex:1;padding:10px;border-radius:10px;background:none;color:var(--dim);font-size:.92rem;font-weight:500}
.seg.on{background:var(--gold-soft);color:var(--gold-tx);border:1px solid var(--gold)}

.steps{display:flex;gap:6px;margin:0 0 16px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--cov);transition:background .3s}
.steps i.on{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.step{display:none}
.step.on{display:block;animation:pin .3s cubic-bezier(.2,.8,.3,1) both}
.stat-line{display:flex;align-items:center;gap:8px;margin-top:12px;padding:11px 13px;border-radius:12px;font-size:.87rem}
.stat-line.free{background:var(--rest-soft);border:1px solid var(--rest);color:var(--rest-tx)}
.stat-line.pay{background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold-tx)}
.price{text-align:center;padding:20px;border-radius:16px;margin-top:14px;
  border:1px solid var(--line);background:var(--gold-soft)}
.price .big{font-family:'Space Grotesk',monospace;font-size:2.5rem;font-weight:600;color:var(--gold-tx);display:block;line-height:1.1}
.price .per{font-size:.8rem;color:var(--dim);margin-top:4px}
.price ul{text-align:start;margin:14px 0 0;padding-inline-start:18px;padding-inline-end:0;font-size:.87rem;color:var(--dim);line-height:1.9}

.tabbar{position:fixed;bottom:0;right:0;left:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);
  height:calc(var(--bar-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--top);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-top:1px solid var(--line-s)}
.tabbar[data-n="3"]{grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--dim);font-size:.68rem;font-weight:500;position:relative;padding:0}
.tab[hidden]{display:none}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab::before{content:"";position:absolute;top:0;right:50%;transform:translateX(50%) scaleX(0);
  width:34px;height:2px;border-radius:0 0 3px 3px;background:var(--gold);transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.tab.on{color:var(--gold-tx)}
.tab.on::before{transform:translateX(50%) scaleX(1)}
.tab .dot{position:absolute;top:9px;inset-inline-end:calc(50% - 20px);width:7px;height:7px;border-radius:50%;
  background:var(--rest);display:none}
.tab .dot.show{display:block}

.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(20,26,32,.42);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .3s}
.sheetbg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;right:0;left:0;bottom:0;max-height:88vh;overflow-y:auto;
  background:var(--sheet);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:8px 18px calc(28px + env(safe-area-inset-bottom));transform:translateY(102%);
  transition:transform .38s cubic-bezier(.2,.8,.3,1);box-shadow:0 -20px 60px -30px rgba(0,0,0,.5)}
.sheet.open{transform:none}
.handle{width:42px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 16px}
/* ---------- באנר עדכון ---------- */
.upd{position:fixed;top:calc(env(safe-area-inset-top) + 60px);left:50%;z-index:82;
  transform:translate(-50%,-180%);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;max-width:min(94vw,460px);
  background:var(--sheet);border:1px solid var(--rest);border-radius:14px;
  padding:10px 12px 10px 14px;box-shadow:0 16px 34px -16px rgba(0,0,0,.5);
  transition:transform .35s cubic-bezier(.2,.8,.3,1),opacity .35s}
.upd.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.upd span{font-size:.87rem;flex:1}
.upd .dotp{width:8px;height:8px;border-radius:50%;background:var(--rest);flex:none;
  box-shadow:0 0 0 4px var(--rest-soft)}
.upd button{background:var(--rest-soft);border:1px solid var(--rest);color:var(--rest-tx);
  font-weight:700;font-size:.83rem;padding:8px 14px;border-radius:10px;flex:none}
body.has-upd .toast{top:calc(env(safe-area-inset-top) + 124px)}
.ver{font-size:.7rem;color:var(--dim);font-family:'Space Grotesk',monospace;margin-top:2px}

.toast{position:fixed;top:calc(env(safe-area-inset-top) + 66px);left:50%;z-index:80;
  transform:translate(-50%,-180%);opacity:0;pointer-events:none;
  background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);
  font-weight:700;padding:11px 20px;border-radius:13px;cursor:pointer;
  transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .3s ease;
  box-shadow:0 14px 30px -14px rgba(0,0,0,.45);font-size:.9rem;line-height:1.35;text-align:center;
  max-width:min(92vw,420px)}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}

/* ---------- מסך התקנה ---------- */
.gate{position:fixed;inset:0;z-index:99;display:none;place-items:center;padding:24px;
  background:var(--bg);overflow-y:auto}
.gate.on{display:grid}
.gate .box{max-width:420px;text-align:center;background:var(--glass);border:1px solid var(--line);
  border-radius:22px;padding:30px 24px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.gate .logo{width:64px;height:64px;border-radius:20px;margin:0 auto 18px;position:relative;
  background:var(--gold-soft);border:1px solid var(--line)}
.gate .logo::before,.gate .logo::after{content:"";position:absolute;top:14px;bottom:14px;width:3px;border-radius:3px;
  background:linear-gradient(var(--gold),transparent)}
.gate .logo::before{right:24px}.gate .logo::after{left:24px}
.gate ol{text-align:start;color:var(--dim);font-size:.9rem;line-height:1.9;margin:16px 0 0;padding-inline-start:20px}
.gate ol b{color:var(--text)}
.gate .link{background:none;border:0;color:var(--dim);font-size:.82rem;text-decoration:underline;margin-top:18px}


/* ---------- לוח מודעות ---------- */
.notice{border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-top:9px;background:var(--glass-2)}
.notice.pin{border-color:var(--gold);background:var(--gold-soft)}
.notice.rep{border-inline-start:3px solid var(--rest);cursor:pointer}
.notice.rep:hover{background:var(--glass)}
.notice .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.notice h4{margin:0 0 3px;font-size:.97rem;font-weight:700}
.notice p{font-size:.89rem;color:var(--dim);margin:0;white-space:pre-wrap}
.notice .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;
  font-size:.7rem;color:var(--dim);font-family:'Space Grotesk',monospace}
.pinflag{font-size:.63rem;letter-spacing:.1em;color:var(--gold-tx);font-weight:700}
.xbtn{background:none;border:0;color:var(--dim);font-size:.75rem;text-decoration:underline;padding:0}

/* ---------- שיתוף ---------- */
.shr{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.shr button{padding:12px 10px;border-radius:12px;border:1px solid var(--line);
  background:var(--glass-2);color:var(--text);font-size:.88rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:7px}
.shr button:hover{border-color:var(--gold)}
.shr button.wa{background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.4);color:#1a8f4c}
html[data-theme=dark] .shr button.wa{color:#7ee2a8}
.shr button.main{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);border:0}
.qrbox{margin-top:14px;text-align:center;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.qrbox canvas{max-width:200px;width:100%;height:auto;display:block;margin:0 auto}
.qrbox .u{font-family:'Space Grotesk',monospace;font-size:.72rem;color:#333;margin-top:10px;direction:ltr;word-break:break-all}

/* ---------- קודים ---------- */
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-s)}
.code:last-child{border-bottom:0}
.code .k{font-size:.9rem}
.code .v{font-family:'Space Grotesk',monospace;font-size:1.05rem;font-weight:600;color:var(--gold-tx);
  letter-spacing:.06em;direction:ltr;cursor:pointer;user-select:all}
.code .v.mask{color:var(--dim);letter-spacing:.2em;user-select:none}

/* ---------- סטטוס מהיר ---------- */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.tile{padding:13px 10px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);text-align:center}
.tile b{display:block;font-family:'Space Grotesk',monospace;font-size:1.25rem;font-weight:600;line-height:1.2}
.tile span{font-size:.68rem;color:var(--dim);display:block;margin-top:3px}
.tile.ok b{color:var(--rest-tx)} .tile.warn b{color:var(--gold-tx)}

/* ---------- דיווחים ---------- */
.rep2{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;background:var(--glass-2)}
.rep2 .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:.68rem;font-weight:700;padding:4px 9px;border-radius:99px;border:1px solid var(--line)}
.badge.open{background:var(--gold-soft);color:var(--gold-tx);border-color:var(--gold)}
.badge.prog{background:var(--rest-soft);color:var(--rest-tx);border-color:var(--rest)}
.badge.done{background:var(--cov);color:var(--dim)}
.badge.kind{background:transparent;color:var(--dim)}
.rep2 p{font-size:.9rem;margin:9px 0 0;white-space:pre-wrap}
.rep2 .meta{font-size:.7rem;color:var(--dim);font-family:'Space Grotesk',monospace;margin-top:9px;
  display:flex;justify-content:space-between;gap:8px;align-items:center}
.shot{width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-top:10px;border:1px solid var(--line);display:block}
.shot.ph{height:120px;display:grid;place-items:center;color:var(--dim);font-size:.8rem;background:var(--cov)}
.filebtn{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);
  background:var(--glass-2);color:var(--dim);font-size:.88rem;cursor:pointer;margin-top:6px}
.filebtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.filebtn input{display:none}
.prev{position:relative;margin-top:10px}
.prev img{width:100%;max-height:200px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.prev button{position:absolute;top:8px;inset-inline-end:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:9px;
  padding:5px 9px;font-size:.75rem}

/* ---------- תשלומים ---------- */
.mrow{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-s)}
.mrow:last-child{border-bottom:0}
.mrow>b{font-family:'Space Grotesk',monospace;font-size:.85rem;color:var(--dim)}
.mons{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.mon{aspect-ratio:1;border-radius:5px;background:var(--cov);border:1px solid var(--line-s);font-size:.55rem;
  color:var(--dim);display:grid;place-items:center;padding:0;font-family:'Space Grotesk',monospace}
.mon.paid{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.mon.now{outline:1px solid var(--rest);outline-offset:1px}
.mygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.mycell{padding:12px 6px;border-radius:12px;text-align:center;border:1px solid var(--line);background:var(--glass-2)}
.mycell b{display:block;font-size:.8rem;font-weight:600}
.mycell small{font-size:.62rem;color:var(--dim)}
.mycell.paid{background:var(--gold-soft);border-color:var(--gold)}
.mycell.paid b{color:var(--gold-tx)}
.mycell.now{outline:1px solid var(--rest);outline-offset:2px}

/* ---------- קוביית זמני שבת ---------- */
.sbt{position:relative;border-radius:18px;padding:18px 16px 14px;overflow:hidden;
  border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow);margin-bottom:14px}
.sbt::before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 100% at 50% 0%,var(--gold-soft),transparent 70%)}
.sbt .pair{position:relative;display:grid;grid-template-columns:1fr 1px 1fr;gap:12px;align-items:center}
.sbt .div{height:38px;background:var(--line)}
.sbt .col{text-align:center}
.sbt .col span{display:block;font-size:.72rem;color:var(--dim);letter-spacing:.05em;margin-bottom:3px}
.sbt .col b{font-family:'Space Grotesk',monospace;font-size:1.75rem;font-weight:600;line-height:1.1;color:var(--gold-tx)}
.sbt .col.out b{color:var(--rest-tx)}
.sbt .foot{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;
  margin-top:13px;padding-top:11px;border-top:1px solid var(--line-s);font-size:.8rem;color:var(--dim)}
.sbt .foot b{color:var(--text);font-weight:500}
.sbt .foot .cd{color:var(--gold-tx)}
.sbt .foot button{background:none;border:0;color:var(--dim);font-size:1.05rem;padding:2px 9px;border-radius:8px}
.sbt .foot button:hover{color:var(--gold-tx);background:var(--glass-2)}

/* ---------- מבנה הבניין ---------- */
.flr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-s)}
.flr:last-child{border-bottom:0}
.flr b{font-size:.72rem;color:var(--dim);min-width:70px}
.flr .aps{display:flex;gap:5px;flex-wrap:wrap}
.flr .ap{font-family:'Space Grotesk',monospace;font-size:.75rem;font-weight:600;padding:4px 10px;
  border-radius:8px;background:var(--gold-soft);border:1px solid var(--line);color:var(--gold-tx)}
.flr.pent b{color:var(--rest-tx)}
.flr.pent .ap{background:var(--rest-soft);color:var(--rest-tx)}
.sum{margin-top:10px;font-size:.85rem;color:var(--dim)}
.sum b{color:var(--text);font-family:'Space Grotesk',monospace}

/* ---------- חניה ---------- */
.spot{border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px;background:var(--glass-2)}
.spot.mine{border-color:var(--gold);background:var(--gold-soft)}
.spot.open{border-inline-start:3px solid var(--rest)}
.spot .top{display:flex;align-items:center;gap:10px}
.spot .num{font-family:'Space Grotesk',monospace;font-size:1.5rem;font-weight:700;color:var(--gold-tx);
  min-width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  background:var(--glass);border:1px solid var(--line)}
.spot .who{flex:1;font-size:.9rem}
.spot .who small{display:block;color:var(--dim);font-size:.76rem}
.spot .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.spot .acts button{flex:1;min-width:110px}
.until{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.until button{background:var(--glass-2);border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:9px 15px;font-size:.86rem;font-weight:600}
.until button.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-tx)}
.hint{display:flex;gap:9px;align-items:flex-start;padding:12px 13px;border-radius:12px;margin-top:12px;
  background:var(--rest-soft);border:1px solid var(--rest);font-size:.82rem;color:var(--rest-tx)}
.hint b{display:block;margin-bottom:2px}

/* ---------- בפיתוח ---------- */
.soon{text-align:center;padding:40px 22px;border:1px dashed var(--line);border-radius:18px;background:var(--glass-2)}
.soon .tag{display:inline-block;font-size:.66rem;letter-spacing:.2em;font-weight:700;color:var(--gold-tx);
  background:var(--gold-soft);border:1px solid var(--gold);border-radius:99px;padding:5px 13px;margin-bottom:14px}
.soon p{color:var(--dim);font-size:.9rem;max-width:32ch;margin:8px auto 0}

.tabbar[data-n="5"]{grid-template-columns:repeat(5,1fr)}
.tab{font-size:.63rem}
.esec{display:none}
.esec.on{display:block;animation:pin .3s cubic-bezier(.2,.8,.3,1) both}
.segs.four .seg{font-size:.84rem;padding:9px 4px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .hr,.panel>*{opacity:1!important;transform:none!important}}

#sheetPrint,#sharePrint{display:none}
@media print{
  body{background:#fff;color:#000}body::before{display:none}
  .topbar,.week,main,.tabbar,.sheet,.sheetbg,.toast,.gate{display:none!important}
  #sheetPrint{display:block;padding:20px;font-family:'Heebo',sans-serif}
  body.print-share #sheetPrint{display:none!important}
  body.print-share #sharePrint{display:block;text-align:center;padding:28px;font-family:'Heebo',sans-serif}
  body.print-share #sharePrint h1{font-size:30pt;margin:0 0 6pt}
  body.print-share #sharePrint h2{font-size:17pt;font-weight:400;margin:0 0 18pt;color:#444}
  body.print-share #sharePrint canvas{width:300pt;height:300pt}
  body.print-share #sharePrint p{font-size:13pt;color:#333;margin-top:16pt}
  body.print-share #sharePrint .lnk{font-family:monospace;font-size:12pt;margin-top:8pt}
  #sheetPrint h2{font-size:24pt;margin-bottom:3pt}
  #sheetPrint table{width:100%;border-collapse:collapse;margin-top:12pt}
  #sheetPrint td,#sheetPrint th{border:1px solid #999;padding:8pt 10pt;font-size:15pt;text-align:start}
  #sheetPrint th{background:#eee}
}
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

<div class="gate" id="gate">
  <div class="box">
    <div class="logo"></div>
    <h1 data-i18n="gt.h"></h1>
    <p class="muted" data-i18n="gt.p"></p>
    <div id="gateIos" hidden><ol><li data-i18n="gt.i1"></li><li data-i18n="gt.i2"></li><li data-i18n="gt.i3"></li></ol></div>
    <div id="gateAnd" hidden>
      <ol><li data-i18n="gt.a1"></li><li data-i18n="gt.a2"></li></ol>
      <button class="btn" id="gateBtn" style="margin-top:18px" data-i18n="gt.btn" hidden></button>
    </div>
    <button class="link" id="gateSkip" data-i18n="gt.browser"></button>
  </div>
</div>

<div class="topbar">
  <div class="mark"></div>
  <div class="bldg" id="bName">—</div>
  <button class="acct" id="gearBtn" aria-label="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <button class="acct" id="acctBtn">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span id="acctLbl">—</span>
  </button>
</div>

<main>

  <!-- ============ בית ============ -->
  <div class="panel on" id="p-home">
    <div class="head">
      <span class="eyebrow" data-i18n="hm.eyebrow"></span>
      <h1 data-i18n="hm.h1"></h1>
      <p data-i18n="hm.p"></p>
    </div>

    <div class="strip">
      <div class="tile warn"><b id="tOpen">—</b><span data-i18n="hm.open"></span></div>
      <div class="tile ok"><b id="tPaid">—</b><span data-i18n="hm.paid"></span></div>
      <div class="tile"><b class="num" id="tSab">—</b><span data-i18n="hm.sab"></span></div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="row" style="justify-content:space-between">
        <h3 data-i18n="nb.h"></h3>
        <button class="btn ghost sm" id="nbAdd" data-i18n="nb.add" hidden></button>
      </div>
      <div id="nbForm" hidden style="margin-top:12px">
        <label class="fld" for="nbT" data-i18n="nb.title"></label>
        <input id="nbT">
        <label class="fld" for="nbB" style="margin-top:10px" data-i18n="nb.body"></label>
        <input id="nbB">
        <div class="sw" id="nbPin" style="margin-top:4px">
          <span class="lb"><span data-i18n="nb.pin"></span></span><span class="tg"></span>
        </div>
        <div class="row">
          <button class="btn sm" id="nbPost" data-i18n="nb.post"></button>
          <button class="btn ghost sm" id="nbCancel" data-i18n="rp.cancel"></button>
        </div>
      </div>
      <div id="nbList"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h3 data-i18n="cd.h"></h3>
        <button class="btn ghost sm" id="cdEye" data-i18n="cd.show"></button>
      </div>
      <p class="muted" style="font-size:.8rem" data-i18n="cd.p"></p>
      <div id="cdList"></div>
    </div>
  </div>

  <!-- ============ דיווחים ============ -->
  <div class="panel" id="p-rep">
    <div class="head">
      <span class="eyebrow" data-i18n="rp.eyebrow"></span>
      <h1 data-i18n="rp.h1"></h1>
      <p data-i18n="rp.p"></p>
    </div>

    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="chips">
        <button class="chip on" data-flt="open" data-i18n="stt.open"></button>
        <button class="chip" data-flt="all" data-i18n="rp.all"></button>
        <button class="chip" data-flt="clean" data-i18n="rp.clean"></button>
        <button class="chip" data-flt="fault" data-i18n="rp.fault"></button>
      </div>
      <button class="btn sm" id="rpNew" data-i18n="rp.new"></button>
    </div>

    <div class="card" id="rpForm" hidden>
      <div class="grid2">
        <div><label class="fld" data-i18n="rp.kind"></label>
          <div class="segs" style="margin-top:0">
            <button class="seg on" data-kind="clean" data-i18n="rp.clean"></button>
            <button class="seg" data-kind="fault" data-i18n="rp.fault"></button>
          </div>
        </div>
        <div><label class="fld" for="rpTopic" data-i18n="rp.topic"></label><select id="rpTopic"></select></div>

const memPrefs = {};
const prefs = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return memPrefs[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { memPrefs[k] = v; } },

};

// שתי קריאות במקביל יצרו שתי זהויות שונות. עכשיו יש רק אחת בכל רגע.
function anonOnce() {
  if (!signingIn) {
    signingIn = sb.auth.signInAnonymously().finally(() => { signingIn = null; });
  }
  return signingIn;
}

function wipeLocal() {
  try {
    const ks = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith('sb-') || k.startsWith('bld:'))) ks.push(k);
    }
    ks.forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  for (const k in memPrefs) delete memPrefs[k];
}

async function dbInit() {
  dbError = '';
  if (typeof supabase === 'undefined') { dbError = 'ספריית Supabase לא נטענה — בדוק חיבור לאינטרנט'; return false; }
  try {
    // ללא מנגנון אחסון מותאם — supabase-js מנהל את הסשן בעצמו.
    // מנגנון מותאם גרם לכך שהטוקן לא צורף לבקשות, וה-RLS דחה אותן.
    sb = supabase.createClient(SB_URL, SB_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });
    let s = (await sb.auth.getSession()).data.session;
    if (s) {
      // בודקים את הסשן מול השרת — אבל מנתקים רק אם השרת אמר במפורש
      // שהזהות אינה תקפה. תקלת רשת רגעית (נפוצה ברגע פתיחת אפליקציה)
      // לא תגרום לאיבוד הזהות ולהרשמה מחדש.
      const chk = await sb.auth.getUser();
      if (chk.error) {
        const st = chk.error.status || 0;
        const msg = (chk.error.message || '').toLowerCase();
        const invalid = st === 401 || st === 403 ||
          /not exist|user_not_found|invalid|jwt|expired|missing sub/.test(msg);
        if (invalid) {
          try { await sb.auth.signOut(); } catch (e) {}
          s = null;
        }
        // אחרת: משאירים את הסשן המקומי וממשיכים
      }
    }
    if (!s) {
      const r = await anonOnce();
      if (r.error) {
        dbError = /anonymous/i.test(r.error.message || '')
          ? 'הרשמה אנונימית כבויה בפרויקט Supabase. Authentication ← Providers ← Allow anonymous sign-ins'
          : (r.error.message || 'שגיאת התחברות');
        return false;
      }
      s = r.data.session;
    }
    uid = s && s.user ? s.user.id : null;
    online = !!uid;
    if (!online) dbError = 'לא התקבל משתמש מהשרת';
    return online;
  } catch (e) {
    dbError = (e && e.message) || 'שגיאה לא ידועה';
    return false;
  }
}

function rowToCfg(r) {
  return { id: r.id, address: r.address, name: r.name || r.address, units: r.units,
    lat: +r.lat, lng: +r.lng, candle: r.candle_min, tzeit: r.tzeit_min,
    kw: +r.kw, rate: +r.rate, gap: r.gap_min, dues: +r.dues, plan: r.plan,
    joinCode: r.join_code, vaadApt: r.vaad_apartment, fixed: r.fixed_hours || [],
    floors: r.floors, firstFloor: r.first_floor, perFloor: r.per_floor,
    penthouse: r.penthouse, penthouseUnits: r.penthouse_units,
    parkingOn: r.parking_enabled === true,
    lockHours: r.lock_hours_before === null || r.lock_hours_before === undefined ? 3 : +r.lock_hours_before };
}
const cfgPatch = c => ({
  name: c.name, candle_min: c.candle, tzeit_min: c.tzeit, kw: c.kw, rate: c.rate,
  gap_min: c.gap, dues: c.dues, lat: c.lat, lng: c.lng, lock_hours_before: c.lockHours
});

  penthouse: c.penthouse, penthouse_units: c.penthouseUnits
});
const rowToPerson = r => ({ id: r.id, apt: r.apartment, family: r.full_name, anon: r.anon,
  wa: r.wa, phone: r.phone, lang: r.lang, theme: r.theme, isVaad: r.is_vaad,

// לפני כל כתיבה — לוודא שיש סשן חי ושהטוקן יצורף לבקשה
async function ensureAuth() {
  if (!sb) return false;
  try {
    let s = (await sb.auth.getSession()).data.session;
    if (!s) {
      const r = await anonOnce();
      if (r.error) { dbError = 'auth: ' + r.error.message; return false; }
      s = r.data && r.data.session;
    }
    uid = s && s.user ? s.user.id : null;
    if (!uid) { dbError = 'אין משתמש מחובר'; return false; }
    return true;
  } catch (e) { dbError = 'auth: ' + (e && e.message); return false; }
}

const TZ = 'Asia/Jerusalem', RAD = Math.PI / 180;
function sunsetMs(dayUTC, lat, lng) {
  const J = dayUTC / 864e5 + 2440587.5, n = Math.round(J - 2451545 + 0.0008), Js = n - lng / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * RAD) + 0.02 * Math.sin(2 * M * RAD) + 0.0003 * Math.sin(3 * M * RAD);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545 + Js + 0.0053 * Math.sin(M * RAD) - 0.0069 * Math.sin(2 * L * RAD);
  const dec = Math.asin(Math.sin(L * RAD) * Math.sin(23.44 * RAD));
  const cw = (Math.sin(-0.833 * RAD) - Math.sin(lat * RAD) * Math.sin(dec)) / (Math.cos(lat * RAD) * Math.cos(dec));
  const w = Math.acos(Math.max(-1, Math.min(1, cw))) / RAD;
  return ((Jt + w / 360) - 2440587.5) * 864e5;
}
const locale = () => lang === 'he' ? 'he-IL' : 'en-GB';
const fmtT = ms => new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: TZ, hour12: false }).format(new Date(ms));
const fmtD = ms => new Intl.DateTimeFormat(locale(), { day: 'numeric', month: 'long', timeZone: TZ }).format(new Date(ms));
const locHour = ms => +new Intl.DateTimeFormat('en-GB', { hour: '2-digit', hour12: false, timeZone: TZ }).format(new Date(ms));
const isoDay = ms => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date(ms)).replace(/-/g, '');
function fridayUTC(off) {
  const n = new Date(), d = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()));
  const dw = d.getUTCDay(); let add = (5 - dw + 7) % 7; if (dw === 6) add = 6;
  return d.getTime() + (add + off * 7) * 864e5;
}

const VAPID_PUB = 'BJAnd9gu5vCB4XHCkMjt7IXA0EqLOP0eqw8u1xSzvCYiL6Y7-GqIgJ9FtxCmM5equL8630NGH9XSXE2cW6wItjE';
let pushOn = false;

function b64ToU8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
const pushSupported = () =>
  'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

async function refreshPushState() {
  const st = $('#pnState');
  if (!pushSupported()) { pushOn = false; sw($('#swPush'), false); st.textContent = t('pn.unsup');
    $('#pushRow').hidden = false; return; }
  if (Notification.permission === 'denied') {
    pushOn = false; sw($('#swPush'), false); st.textContent = t('pn.denied');
    $('#pushRow').hidden = false; return;
  }
  const reg = swReg || await navigator.serviceWorker.getRegistration();
  const sub = reg ? await reg.pushManager.getSubscription() : null;
  pushOn = !!sub;
  sw($('#swPush'), pushOn);
  st.textContent = t(pushOn ? 'pn.ok' : 'pn.off');
  $('#pushRow').hidden = !pushOn;
}

$('#swPush').addEventListener('click', async () => {
  if (!pushSupported()) return toast(t('pn.unsup'));
  if (!me) return toast(t('ts.needreg'));
  if (pushOn) {
    const reg = swReg || await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) { await DB.delPush(sub.endpoint); await sub.unsubscribe(); }
    await refreshPushState(); return toast(t('ts.pnoff'));
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { await refreshPushState(); return toast(t('ts.pnfail')); }
  try {
    const reg = swReg || await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUB) });
    const ok = await DB.savePush(me.id, cfg.id, sub);
    await refreshPushState();
    toast(ok ? t('ts.pnon') : dbError);
  } catch (e) { await refreshPushState(); toast(t('ts.pnfail') + ' · ' + (e && e.message || '')); }
});

async function checkUpdate(loud) {
  if (!swReg) { if (loud) toast(t('up.none')); return; }
  try { await swReg.update(); } catch (e) {}
  if (swReg.waiting) showUpdate(swReg.waiting);
  else if (loud) toast(t('up.none'));
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return; reloading = true; location.reload();
  });
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      swReg = reg;
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(nw);
        });
      });
      setInterval(() => checkUpdate(false), 30 * 60 * 1000);
    }).catch(() => {});
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(false); });
}

function shrink(file, max = 900, q = 0.6) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

  if (!isVaad) return toast(t('ts.needreg'));
  cfg.dues = +$('#cDues').value || 0;
  const ok = await DB.saveBuilding(cfg.id, { dues: cfg.dues });
  renderPay(); toast(ok ? t('ts.dues') : t('ts.conn'));
});

function renderPay() {
  $('#yLbl').textContent = payYear;
  $('#cDues').value = cfg.dues;
  const vaadAll = isVaad && payView === 'all';
  $('#pyMine').hidden = vaadAll; $('#pyAll').hidden = !vaadAll;
  $('#pyLock').textContent = t('py.lock');
  $('#pyLock').hidden = canEdit();
  $('#pyBody').hidden = !canEdit();
  if (!canEdit()) return;
  const now = new Date(), curY = now.getFullYear(), curM = now.getMonth();
  if (!vaadAll) {
    const apt = me ? me.apt : 0;
    const rec = (me && pays[apt]) || { m: {} };
    let paid = 0, total = 0;
    const g = $('#myMonths'); g.innerHTML = '';
    for (let m = 0; m < 12; m++) {
      const k = ymKey(payYear, m), on = !!(rec.m && rec.m[k]);
      const amt = paidAmount(rec, k, apt);
      if (on) { paid++; total += amt; }
      const c = document.createElement('div');
      c.className = 'mycell' + (on ? ' paid' : '') + (payYear === curY && m === curM ? ' now' : '');
      c.innerHTML = `<b>${MON(m)}</b><small>${on ? '₪' + amt : '—'}</small>`;
      if (isVaad && me) c.onclick = () => editPay(apt, m);
      g.appendChild(c);
    }
    $('#pyPaid').textContent = paid + '/12';
    $('#pyTotal').textContent = total;
    const r = rates[apt];
    $('#pyNote').textContent = t('py.rate', { n: rateOf(apt) })
      + ((r && r.amount !== null && r.amount !== undefined && +r.amount !== +cfg.dues) ? ' · ' + t('py.disc') : '')
      + ' · ' + t('py.note');
    return;
  }
  const box = $('#allRows'); box.innerHTML = '';
  let grand = 0;
  for (let a = 1; a <= cfg.units; a++) {
    const rec = pays[a] || { m: {} };
    const row = document.createElement('div'); row.className = 'mrow';
    const lab = document.createElement('b');
    const disc = rates[a] && rates[a].amount !== null && rates[a].amount !== undefined
                 && +rates[a].amount !== +cfg.dues;
    lab.innerHTML = a + (disc ? '<br><span style="font-size:.6rem;color:var(--rest-tx)">₪' + rateOf(a) + '</span>' : '');
    const mons = document.createElement('div'); mons.className = 'mons';
    for (let m = 0; m < 12; m++) {
      const k = ymKey(payYear, m), on = !!(rec.m && rec.m[k]);
      if (on) grand += paidAmount(rec, k, a);
      const b = document.createElement('button');
      b.className = 'mon' + (on ? ' paid' : '') + (payYear === curY && m === curM ? ' now' : '');
      b.textContent = m + 1;
      b.title = MON(m) + (on ? ' · ₪' + paidAmount(rec, k, a) : '');
      b.onclick = () => editPay(a, m);
      mons.appendChild(b);
    }
    row.append(lab, mons); box.appendChild(row);
  }
  const sum = document.createElement('div'); sum.className = 'sum';
  sum.innerHTML = t('py.total') + ': <b>₪' + grand + '</b>';
  box.appendChild(sum);
}

/* ---------- טעינת נתוני הבניין ---------- */
async function loadBuilding() {
  notes = {}; reports = {}; pays = {}; codes = []; rates = {};
  if (cfg.id) {
    const [n, c, r, p, rt] = await Promise.all([
      DB.notices(cfg.id), DB.codes(cfg.id), DB.reports(cfg.id),
      DB.payments(cfg.id, payYear), DB.rates(cfg.id)
    ]);
    notes = n; codes = c; reports = r; pays = p; rates = rt;
  }
  renderCodes(); fillTopics(); renderReports(); renderNotes(); renderPay(); renderHome();
}

/* ==================================================================
   חניה
   ================================================================== */
let spots = [], offers = [], relSpot = null, relUntil = null;

const mySpots = () => (me ? spots.filter(s => +s.apartment === +me.apt) : []);
const spotOf = id => spots.find(s => s.id === id);
const offerOfSpot = id => offers.find(o => o.spot_id === id && (o.status === 'open' || o.status === 'taken'));
const myOffer = () => me ? offers.find(o => o.owner_id === me.id) : null;
const myClaim = () => me ? offers.find(o => o.taken_by === me.id && o.status === 'taken') : null;
const hhmm = ts => new Intl.DateTimeFormat('en-GB',
  { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TZ }).format(new Date(ts));

/* ---------- גיליון שחרור ---------- */
const openFree = v => { $('#freeSheet').classList.toggle('open', v); $('#freeSheetBg').classList.toggle('open', v); };
$('#freeSheetBg').addEventListener('click', () => openFree(false));
$('#relClose').addEventListener('click', () => openFree(false));

const UNTILS = [
  { k: 'pk.u2', f: () => Date.now() + 2 * 3600e3 },
  { k: 'pk.u4', f: () => Date.now() + 4 * 3600e3 },
  { k: 'pk.u16', f: () => atHour(16) },
  { k: 'pk.u18', f: () => atHour(18) },
  { k: 'pk.utom', f: () => atHour(8, 1) }
];
function atHour(h, addDays) {
  const d = new Date();
  d.setHours(h, 0, 0, 0);
  if (addDays) d.setDate(d.getDate() + addDays);
  if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
  return d.getTime();
}
function openRelease(spot) {
  if (!spot) return;
  relSpot = spot; relUntil = null;
  $('#relSub').textContent = t('pk.code') + ' ' + spot.code;
  const box = $('#untilBtns'); box.innerHTML = '';
  UNTILS.forEach(u => {
    const b = document.createElement('button');
    b.textContent = t(u.k);
    b.onclick = () => {
      relUntil = u.f();
      [...box.children].forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      const d = new Date(relUntil);
      $('#relTime').value = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    };
    box.appendChild(b);
  });
  $('#relTime').value = '';
  openFree(true);
}
$('#relTime').addEventListener('change', () => {
  const v = $('#relTime').value; if (!v) return;
  const [h, m] = v.split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
  relUntil = d.getTime();
  [...$('#untilBtns').children].forEach(c => c.classList.remove('on'));
});
$('#relGo').addEventListener('click', async () => {
  if (!canEdit()) return toast(t('ts.needreg'));
  if (!relSpot) return;
  if (!relUntil) relUntil = Date.now() + 2 * 3600e3;
  const ok = await DB.release(cfg.id, relSpot.id, me.id, new Date(relUntil).toISOString());
  openFree(false);
  if (!ok) return toast(dbError || t('ts.conn'), 5000);
  toast(t('ts.relok'));
  await loadParking();
});

/* ---------- רינדור ---------- */
let featPending = false;

function parkingOn() { return cfg.parkingOn === true || isAdmin; }

function renderParking() {
  const on = parkingOn();
  // הטאב מוסתר לדיירים כשהמודול כבוי; הוועד רואה מסך נעול כדי שיוכל לבקש
  $('#tabPark').hidden = !(on || isVaad);
  $('#tabbar').dataset.n = $('#tabPark').hidden ? 4 : 5;
  if ($('#tabPark').hidden && $('#p-park').classList.contains('on')) go('home');

  $('#parkLocked').hidden = on;
  ['#mySpotCard', '#myClaimCard'].forEach(id => { if (!on) $(id).hidden = true; });
  document.querySelectorAll('#p-park > .card').forEach(c => { c.hidden = !on; });
  if (!on) {
    $('#parkAsk').hidden = !(isVaad && !featPending);
    $('#parkAsked').hidden = !featPending;
    return;
  }

  const canPark = canEdit();
  $('#spotAdmin').hidden = !isVaad;
  sw($('#swPark'), me ? me.parking !== false : false);
  if (me) { $('#carPlate').value = me.plate || ''; $('#carDesc').value = me.car || ''; }

  /* החניה שלי */
  const mine = mySpots();
  const box = $('#mySpot');
  $('#mySpotCard').hidden = !canPark;
  box.innerHTML = '';
  if (!mine.length) {
    box.innerHTML = `<p class="muted" style="margin-top:8px">${t('pk.nospot')}</p>`;
  } else {
    mine.forEach(sp => {
      const off = offerOfSpot(sp.id);
      const el = document.createElement('div'); el.className = 'spot mine';
      const taker = off && off.taken_by ? people[off.taken_by] : null;
      el.innerHTML = `<div class="top">
          <span class="num">${esc(sp.code)}</span>
          <span class="who">${off ? (off.status === 'taken'
              ? t('pk.taken', { n: taker ? taker.apt : '?' })
              : t('pk.until', { t: hhmm(off.until_ts) }))
            : t('pk.mine')}
            <small>${off ? t('pk.until', { t: hhmm(off.until_ts) }) : ''}</small></span>
        </div>`;
      const acts = document.createElement('div'); acts.className = 'acts';
      if (!off) {
        const b = document.createElement('button'); b.className = 'btn sm'; b.textContent = t('pk.free');
        b.onclick = () => openRelease(sp);
        acts.appendChild(b);
      } else {
        if (off.status === 'taken' && !off.returning_at) {
          const b = document.createElement('button'); b.className = 'btn sm'; b.textContent = t('pk.back');
          b.onclick = async () => { await DB.callBack(off.id); toast(t('ts.relback')); await loadParking(); };
          acts.appendChild(b);
        }
        const c = document.createElement('button'); c.className = 'btn ghost sm'; c.textContent = t('pk.cancel');
        c.onclick = async () => { await DB.endOffer(off.id, 'cancelled'); toast(t('ts.relcancel')); await loadParking(); };
        acts.appendChild(c);
      }
      el.appendChild(acts);
      box.appendChild(el);
    });
  }

  /* חניה שתפסתי */
  const mc = myClaim();
  $('#myClaimCard').hidden = !mc;
  if (mc) {
    const sp = spotOf(mc.spot_id), owner = people[mc.owner_id];
    const el = $('#myClaim'); el.innerHTML = '';
    const d = document.createElement('div'); d.className = 'spot';
    d.innerHTML = `<div class="top"><span class="num">${sp ? esc(sp.code) : '?'}</span>
      <span class="who">${t('pk.until', { t: hhmm(mc.until_ts) })}
        <small>${owner ? t('pk.by', { n: owner.apt }) : ''}${mc.returning_at ? ' · ' + t('pk.back') : ''}</small></span></div>`;
    const acts = document.createElement('div'); acts.className = 'acts';
    const b = document.createElement('button'); b.className = 'btn sm'; b.textContent = t('pk.leave');
    b.onclick = async () => { await DB.endOffer(mc.id, 'ended'); await loadParking(); };
    acts.appendChild(b); d.appendChild(acts); el.appendChild(d);
  }

  /* פנויות */
  const openOnes = offers.filter(o => o.status === 'open' && (!me || o.owner_id !== me.id));
  $('#openCount').textContent = openOnes.length || '';
  const ol = $('#openList'); ol.innerHTML = '';
  if (!openOnes.length) {
    ol.innerHTML = `<p class="muted" style="margin-top:8px">${t('pk.none')}</p>`;
  } else {
    openOnes.forEach(o => {
      const sp = spotOf(o.spot_id), owner = people[o.owner_id];
      const el = document.createElement('div'); el.className = 'spot open';
      el.innerHTML = `<div class="top"><span class="num">${sp ? esc(sp.code) : '?'}</span>
        <span class="who">${t('pk.until', { t: hhmm(o.until_ts) })}
          <small>${owner ? t('pk.by', { n: owner.apt }) : ''}</small></span></div>`;
      const acts = document.createElement('div'); acts.className = 'acts';
      const b = document.createElement('button'); b.className = 'btn sm'; b.textContent = t('pk.take');
      b.onclick = async () => {
        if (!canEdit()) return toast(t('ts.needreg'));
        const ok = await DB.claimSpot(o.id);
        toast(ok ? t('ts.reltaken') : t('ts.relgone'));
        await loadParking();
      };
      acts.appendChild(b); el.appendChild(acts);
      ol.appendChild(el);
    });
  }

  /* ניהול חניות */
  if (isVaad) {
    const sel2 = $('#spApt');
    if (sel2.options.length !== cfg.units + 1) {
      sel2.innerHTML = `<option value="">—</option>` +
        Array.from({ length: cfg.units }, (_, i) => `<option value="${i + 1}">${aptLabel(i + 1)}</option>`).join('');
    }
    const list = $('#spotList'); list.innerHTML = '';
    spots.forEach(sp => {
      const d = document.createElement('div'); d.className = 'code';
      d.innerHTML = `<span class="k">${esc(sp.code)}</span>
        <span class="v">${sp.apartment ? aptLabel(sp.apartment) : '—'}</span>`;
      const x = document.createElement('button'); x.className = 'xbtn'; x.textContent = t('pk.del');
      x.onclick = async () => { await DB.delSpot(sp.id); await loadParking(); };
      d.appendChild(x); list.appendChild(d);
    });
  }
}

$('#spAdd').addEventListener('click', async () => {
  if (!isVaad) return toast(t('ts.needreg'));
  const code = $('#spCode').value.trim();
  if (!code) return toast(t('ts.needspot'));
  const ok = await DB.addSpot(cfg.id, code, +$('#spApt').value || null);
  if (!ok) return toast(dbError || t('ts.conn'), 5000);
  $('#spCode').value = ''; toast(t('ts.spotadd'));
  await loadParking();
});
$('#swPark').addEventListener('click', () => {
  if (!me) return toast(t('ts.needreg'));
  me.parking = me.parking === false;
  sw($('#swPark'), me.parking !== false);
  DB.updateMe(me.id, { parking_alerts: me.parking !== false });
});
$('#carSave').addEventListener('click', async () => {
  if (!me) return toast(t('ts.needreg'));
  me.plate = $('#carPlate').value.trim();
  me.car = $('#carDesc').value.trim();
  await DB.updateMe(me.id, { car_plate: me.plate, car_desc: me.car });
  toast(t('ts.carsaved'));
});

$('#parkAsk').addEventListener('click', async () => {
  if (!isVaad) return toast(t('ts.needreg'));
  const ok = await DB.requestFeature(cfg.id, me.id, 'parking');
  if (!ok) return toast(dbError || t('ts.conn'), 5000);
  featPending = true; renderParking(); toast(t('ts.reqsent'));
});

async function loadParking() {
  spots = []; offers = [];
  if (cfg.id) {
    if (parkingOn()) {
      const [sp, of] = await Promise.all([DB.spots(cfg.id), DB.offers(cfg.id)]);
      spots = sp; offers = of;
    } else {
      featPending = (await DB.myRequests(cfg.id)).length > 0;
    }
  }
  renderParking();
}

/* פתיחה ישירה למסך השחרור: ?free=1 */
function parkingDeepLink() {
  const q = new URLSearchParams(location.search);
  if (q.get('tab') === 'park') go('park');
  if (q.get('free') !== '1') return;
  go('park');
  const mine = mySpots();
  if (mine.length && !offerOfSpot(mine[0].id)) openRelease(mine[0]);
}

boot(true);

</script>
